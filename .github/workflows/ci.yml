name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default to read-only. Individual jobs can request more.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v3
      - name: ruff check
        run: uvx ruff check .
      - name: ruff format check
        run: uvx ruff format --check .

  env-examples:
    name: Validate .env.example files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run check_env_examples
        run: python tools/check_env_examples.py

  prose-rules:
    name: No em-dashes, no cliche words
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: No em-dash or en-dash characters
        run: |
          # Exclude this workflow file: its grep regex contains the
          # very characters we are scanning for, which would
          # otherwise self-trigger.
          if grep -RE '—|–' \
              --exclude-dir=.git \
              --exclude-dir=.venv \
              --exclude='uv.lock' \
              --exclude='ci.yml' \
              .; then
            echo "::error::em-dash or en-dash found above"
            exit 1
          fi
      - name: No banned cliche words
        run: |
          if grep -RiE 'crucial|essential|leverage|dive in|unpack|journey|robust|seamless|streamline|embark' \
              --include='README.md' --include='*.py' --include='*.md' \
              --exclude-dir=.git --exclude-dir=.venv \
              --exclude='ci.yml' \
              .; then
            echo "::error::banned cliche word found above"
            exit 1
          fi

  chapters:
    name: Validate ${{ matrix.chapter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chapter:
          - 01-voice-stack
          - 02-first-agent
          - 03-prompts
          - 04-tools-state-handoffs
          - 05-latency-turn-taking
          - 06-patterns
          - 07-surfaces
          - 08-testing
          - 09-deployment
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - name: uv sync
        working-directory: ${{ matrix.chapter }}
        run: uv sync
      - name: py_compile every Python file
        working-directory: ${{ matrix.chapter }}
        run: |
          set -e
          find . -maxdepth 3 -name '*.py' \
            -not -path './.venv/*' \
            -not -path './tests/*' \
            -print0 \
          | xargs -0 -I {} uv run python -m py_compile {}
      - name: pytest --collect-only (Chapter 8)
        if: matrix.chapter == '08-testing'
        working-directory: ${{ matrix.chapter }}
        run: uv run pytest --collect-only
