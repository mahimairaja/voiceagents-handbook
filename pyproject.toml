# Repo-level configuration for the voiceagents-handbook companion repo.
#
# Each chapter folder is its own uv project with its own pyproject.toml that
# pins livekit-agents and the plugins that chapter uses. This root file holds
# only the shared lint and format configuration so `uvx ruff check .` works
# the same on every chapter.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "**/.venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# The chapter projects each have an `agent.py` module that their own
# tests import via `from agent import Assistant`. Treat it as first-party
# so the import ordering is stable.
known-first-party = ["agent"]

[tool.ruff.format]
quote-style = "double"
